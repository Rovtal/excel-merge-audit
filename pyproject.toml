[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "excel-merge-audit"
version = "0.2.0"
description = "Offline multi-Excel (.xlsx) and CSV/TSV merger, bilingual column mapper, duplicate/conflict auditor, and formula-backed Excel reporter."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Rovtal", email = "126407136+Rovtal@users.noreply.github.com" }
]
dependencies = [
  "lxml>=5.0",
  "XlsxWriter>=3.1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6"
]

[project.scripts]
excel-merge = "excel_merge_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
