name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and dev dependencies
        run: python -m pip install --upgrade pip && pip install -e .[dev]
      - name: Run ruff strict checks
        run: ruff check --select F,B,S,E7,W6,C4,SIM .
      - name: Run pytest suite
        run: pytest -v
      - name: Smoke test CLI version and EN demo
        run: |
          excel-merge --version
          excel-merge demo --lang en --out-dir /tmp/ema-smoke-en
